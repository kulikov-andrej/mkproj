name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Resolve version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME"
            exit 1
          fi

          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Test
        run: go test ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist

          LDFLAGS="-X github.com/kulikov-andrej/mkproj/internal/buildinfo.Version=$VERSION"

          GOOS=windows GOARCH=amd64 \
            go build \
              -trimpath \
              -ldflags="$LDFLAGS" \
              -o dist/mkproj-windows-amd64.exe \
              ./cmd/mkproj

          GOOS=linux GOARCH=amd64 \
            go build \
              -trimpath \
              -ldflags="$LDFLAGS" \
              -o dist/mkproj-linux-amd64 \
              ./cmd/mkproj

      - name: Verify version
        run: |
          chmod +x dist/mkproj-linux-amd64

          test "$(
            ./dist/mkproj-linux-amd64 --version
          )" = "mkproj $VERSION"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/mkproj-windows-amd64.exe \
            dist/mkproj-linux-amd64 \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"